# Simplest setup: SQLite database and uploaded files on a local volume.
#   docker compose up -d
# For PostgreSQL + S3 (MinIO) storage, see docker-compose.postgres.yml.
services:
  whiteboard:
    build: .
    image: technical-whiteboard
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    volumes:
      - whiteboard-data:/data

volumes:
  whiteboard-data:
